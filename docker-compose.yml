services:

  qdrant-db:
    image: qdrant/qdrant:latest
    container_name: qdrant_vector_db

    ports:
      - "6333:6333"
      - "6334:6334"

    volumes:
      - ./qdrant_storage:/qdrant/storage

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:6333/healthz || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10


  streamlit-app:
    build: .

    container_name: streamlit_hybrid_rag

    ports:
      - "8502:8501"

    environment:
      QDRANT_HOST: qdrant-db
      QDRANT_PORT: "6333"
      QDRANT_COLLECTION: large_pdf_hybrid_rag

      EMBEDDING_MODEL: BAAI/bge-small-en-v1.5
      RERANKER_MODEL: cross-encoder/ms-marco-MiniLM-L-6-v2

      CHUNK_TOKENS: "450"
      CHUNK_OVERLAP: "75"

      VECTOR_TOP_K: "15"
      BM25_TOP_K: "15"
      FINAL_TOP_K: "5"

      GROQ_MODEL: openai/gpt-oss-120b
      GROQ_API_KEY: ${GROQ_API_KEY}

    volumes:
      - ./data:/workspace/data
      - ./hf_cache:/workspace/hf_cache

    depends_on:
      qdrant-db:
        condition: service_healthy

    restart: unless-stopped
